name: キャラクター自動生成

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      custom_prompt:
        description: 'カスタムプロンプト（任意）: CSV内容を修正するための追加指示'
        required: false
        type: string
        default: ''
  # キャラクター画像が追加・変更された時に自動実行
  push:
    paths:
      - 'WorkFlow_origin/character/**/*.png'
      - 'WorkFlow_origin/character/**/*.jpg'
      - 'WorkFlow_origin/character/**/*.jpeg'

jobs:
  generate-character:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorkFlow_origin

    steps:
      # リポジトリのチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # Node.jsのセットアップ
      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'WorkFlow_origin/package.json'

      # 依存関係のインストール
      - name: 依存関係をインストール
        run: npm ci

      # 出力ディレクトリの作成
      - name: 出力ディレクトリを作成
        run: |
          mkdir -p output/character

      # キャラクターCSV生成
      - name: キャラクターCSVを生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CUSTOM_PROMPT: ${{ github.event.inputs.custom_prompt || '' }}
        run: npm run generate-character-csv

      # 生成されたキャラクターCSVをArtifactとしてアップロード
      - name: キャラクターCSVをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: character-csv-files
          path: WorkFlow_origin/character/**/*.csv
          retention-days: 90

      # 結果をコミット
      - name: 結果をコミット
        if: success()
        working-directory: .
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # キャラクターCSVファイルに変更があればコミット
          if [[ -n $(git status -s WorkFlow_origin/character/) ]]; then
            git add WorkFlow_origin/character/
            git commit -m "🤖 自動生成: キャラクター特徴CSV $(date '+%Y-%m-%d')"
            git push
          else
            echo "変更がないため、コミットをスキップします"
          fi

      # 完了メッセージ
      - name: 完了
        run: |
          echo "✅ キャラクター特徴CSV生成完了"
          echo ""
          echo "📦 Artifactからダウンロードできます:"
          echo "   📄 character-csv-files - キャラクター特徴CSV"
          echo ""
          echo "📝 生成されたCSVファイルは character/ フォルダに保存されています"
          echo ""
          echo "🎨 キャラクター一覧:"
          ls -1 character/ | grep -v ".DS_Store" | grep -v ".csv" | sed 's/^/   - /'
