name: キャラクター特徴・画像ルール生成

on:
  # 手動実行
  workflow_dispatch:
  # キャラクター画像が追加・変更された時に自動実行
  push:
    paths:
      - 'WorkFlow_origin/character/**/*.png'
      - 'WorkFlow_origin/character/**/*.jpg'
      - 'WorkFlow_origin/character/**/*.jpeg'

jobs:
  generate-character-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorkFlow_origin

    steps:
      # リポジトリのチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # Node.jsのセットアップ
      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'WorkFlow_origin/package.json'

      # 依存関係のインストール
      - name: 依存関係をインストール
        run: npm ci

      # 出力ディレクトリの作成
      - name: 出力ディレクトリを作成
        run: |
          mkdir -p output/character
          mkdir -p output/images

      # ホームページ解析
      - name: ホームページを解析
        run: npm run analyze-homepage

      # 画像ルール生成
      - name: 画像ルールを生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate-imagerule

      # キャラクターCSV生成
      - name: キャラクターCSVを生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate-character-csv

      # 生成されたキャラクターCSVをArtifactとしてアップロード
      - name: キャラクターCSVをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: character-csv-files
          path: WorkFlow_origin/character/**/*.csv
          retention-days: 90

      # 画像ルールファイルをアップロード
      - name: 画像ルールをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: image-rule
          path: WorkFlow_origin/output/image-rule.txt
          retention-days: 90
        if: always()

      # ビジネスサマリーをアップロード
      - name: ビジネスサマリーをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: business-summary
          path: WorkFlow_origin/output/business-summary.txt
          retention-days: 90
        if: always()

      # 結果をコミット
      - name: 結果をコミット
        if: success()
        working-directory: .
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # キャラクターCSVファイルに変更があればコミット
          if [[ -n $(git status -s WorkFlow_origin/character/) ]] || [[ -n $(git status -s WorkFlow_origin/output/) ]]; then
            git add WorkFlow_origin/character/
            git add WorkFlow_origin/output/
            git commit -m "🤖 自動生成: キャラクター特徴・画像ルール $(date '+%Y-%m-%d')"
            git push
          else
            echo "変更がないため、コミットをスキップします"
          fi

      # 完了メッセージ
      - name: 完了
        run: |
          echo "✅ キャラクター特徴・画像ルール生成完了"
          echo ""
          echo "📦 以下のArtifactからダウンロードできます:"
          echo "   1️⃣ character-csv-files - キャラクター特徴CSV"
          echo "   2️⃣ image-rule - 画像生成ルール"
          echo "   3️⃣ business-summary - ビジネスサマリー"
          echo ""
          echo "💡 各Artifactは個別にダウンロード可能です（zipファイルとして）"
          echo "📝 生成されたCSVファイルは character/ フォルダに保存されています"
          echo ""
          echo "🎨 キャラクター一覧:"
          ls -1 character/ | grep -v ".DS_Store" | grep -v ".csv" | sed 's/^/   - /'
